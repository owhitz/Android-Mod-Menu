name: Build libMenu.so

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-cpp:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r25b

    - name: Compile C++ with CMake
      env:
        NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        cd app/src/main/jni
        cmake -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -S . -B build
        cmake --build build -j4

    - name: Upload libMenu.so
      uses: actions/upload-artifact@v4
      with:
        name: libMenu
        path: app/src/main/jni/build/**/*.so
